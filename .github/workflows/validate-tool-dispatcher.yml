name: Validate tool dispatcher

on:
  pull_request:
    branches:
      - agent/v0.6-runtime-tool-permissions
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  extract-and-validate:
    if: ${{ github.event.pull_request.head.ref == 'agent/v0.6-tool-dispatcher' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.6-tool-dispatcher
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-tool-dispatcher-refactor.mjs
      - run: npm ci --ignore-scripts
      - run: npm run test:tool-dispatcher
      - run: npm run test:tool-permissions
      - run: npm run test:runtime
      - run: npm run test:browser
      - run: npm run test:mcp
      - run: npm run test:harness-v2
      - run: npm run build
      - name: Commit validated extraction
        run: |
          git config user.name "AporiaX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: extract native tool dispatcher [tool-dispatcher-validated]"
          git push origin HEAD:agent/v0.6-tool-dispatcher
