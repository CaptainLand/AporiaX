name: Validate capability registry

on:
  pull_request:
    branches:
      - agent/v0.6-tool-catalog
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.event.pull_request.head.ref == 'agent/v0.6-capability-registry' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.6-capability-registry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-capability-registry-refactor.mjs
      - run: npm ci --ignore-scripts
      - run: npm run test:capabilities
      - run: npm run test:architecture
      - run: npm run test:harness-v2
      - run: npm run test:runtime
      - run: npm run build
      - name: Commit validated capability layer
        run: |
          git config user.name "AporiaX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add unified capability registry [capability-registry-validated]"
          git push origin HEAD:agent/v0.6-capability-registry
