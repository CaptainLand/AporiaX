# Temporary preparation workflow for PR #62. Removed from the final tree.
name: Prepare audit artifacts
on:
  push:
    branches: [fix/0.9.7-architecture-reliability-audit]
    paths: [.github/workflows/audit-prepare.yml, .audit-patch]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'CaptainLand/AporiaX' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify and stage exact proposed source
        if: hashFiles('.audit-patch') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs';
          import { dirname } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { gunzipSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          const envelope=JSON.parse(readFileSync('.audit-patch','utf8'));
          if(envelope.version!==1 || !Array.isArray(envelope.parts) || envelope.parts.length>16) throw Error('Invalid patch manifest');
          const chunks=[];
          for(const sha of envelope.parts){
            if(!/^[a-f0-9]{40}$/.test(sha)) throw Error('Invalid blob id');
            const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs/${sha}`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
            if(!response.ok)throw Error(`Patch blob unavailable: ${response.status}`);
            const blob=await response.json();chunks.push(Buffer.from(blob.content,'base64'));
          }
          const decoded=gunzipSync(Buffer.concat(chunks),{maxOutputLength:1000000});
          if(createHash('sha256').update(decoded).digest('hex')!==envelope.sha256)throw Error('Patch checksum mismatch');
          const patch=JSON.parse(decoded), hash=bytes=>createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
          if(patch.version!==1 || !Array.isArray(patch.files) || patch.files.length>150)throw Error('Invalid source edits');
          for(const file of patch.files){
            const path=file.path;
            if(path.includes('..') || path.includes('\\') || (!/^(electron|src|tests|scripts|docs|\.github)\//.test(path) && !['package.json','package-lock.json','SECURITY.md','.node-version'].includes(path)))throw Error('Unexpected path');
            let before=Buffer.alloc(0);
            try{before=readFileSync(path);if(file.before===null)throw Error('Expected a new path');}catch(error){if(error.code!=='ENOENT' || file.before!==null)throw error;}
            if(file.before!==null && hash(before)!==file.before)throw Error('Source changed: '+path);
            const pieces=[];let position=0;
            for(const [start,end,text] of file.edits){
              if(!Number.isInteger(start)||!Number.isInteger(end)||start<position||end<start||end>before.length||typeof text!=='string')throw Error('Invalid edit');
              pieces.push(before.subarray(position,start),Buffer.from(text));position=end;
            }
            pieces.push(before.subarray(position));const after=Buffer.concat(pieces);
            if(hash(after)!==file.after)throw Error('Result checksum mismatch: '+path);
            mkdirSync(dirname(path),{recursive:true});writeFileSync(path,after);
            execFileSync('git',['add','--',path]);
          }
          console.log(`Verified and staged ${patch.files.length} source files`);
          JS
      - run: npm ci
      - name: Validate proposed audit fixes
        if: hashFiles('.audit-patch') != ''
        run: |
          node --experimental-sqlite tests/audit-reliability.mjs
          npm run test:critical-reliability
          npm run test:context-reliability
          npm run test:reliability-batch3
          npm run test:runtime
          npm run test:harness-v2
          npm run test:sandbox-recovery
          npm run test:mcp
          npm run build
      - name: Store proposed source blobs without updating any branch
        if: always() && hashFiles('.audit-patch') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const paths = execFileSync('git', ['diff','--cached','--name-only','--diff-filter=ACM','-z'], {encoding:'utf8'}).split('\0').filter(Boolean);
          if (!paths.length) throw new Error('No verified proposed changes');
          const files = [];
          for (const path of paths) {
            if (!/^(electron|src|tests|scripts|docs|\.github)\//.test(path) && !['package.json','package-lock.json','SECURITY.md','.node-version'].includes(path)) throw new Error('Unexpected proposed path: ' + path);
            const content = readFileSync(path);
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({content:content.toString('base64'),encoding:'base64'})});
            if (!response.ok) throw new Error(`Blob creation failed for ${path}: ${response.status}`);
            const blob = await response.json();
            const expected = execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim();
            if (blob.sha !== expected) throw new Error('Blob checksum mismatch: ' + path);
            files.push({path,sha:blob.sha,mode:'100644',type:'blob'});
          }
          writeFileSync('audit-tree-elements.json',JSON.stringify({head:process.env.GITHUB_SHA,files},null,2));
          console.log(JSON.stringify({head:process.env.GITHUB_SHA,files}));
          JS
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('audit-tree-elements.json') != ''
        with:
          name: audit-tree-${{ github.run_id }}
          path: audit-tree-elements.json
          retention-days: 3
