name: Validate turn coordinator

on:
  pull_request:
    branches:
      - agent/v0.6-harness-event-reducers
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: github.head_ref == 'agent/v0.6-turn-coordinator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.6-turn-coordinator
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-turn-coordinator.mjs
      - run: npm ci --ignore-scripts
      - run: npm run test:turn-coordinator
      - run: npm run test:harness-event-reducer
      - run: npm run test:capability-observability
      - run: npm run test:runtime
      - run: npm run test:self-check-coordinator
      - run: npm run test:subagent-loop
      - run: npm run test:harness-v2
      - run: npm run build
      - name: Commit validated coordinator integration
        run: |
          git config user.name "AporiaX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: coordinate run and turn lifecycle [turn-coordinator]"
          git push origin HEAD:agent/v0.6-turn-coordinator
