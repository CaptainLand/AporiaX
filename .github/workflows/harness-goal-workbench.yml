name: Apply verified goal-loop upgrade
on:
  push:
    branches: [codex/harness-goal-loop-20260919]
    paths: [.github/workflows/harness-goal-workbench.yml, .harness-goal.patch]
permissions:
  contents: read
jobs:
  apply-reviewed-patch:
    if: github.repository == 'CaptainLand/AporiaX' && github.ref == 'refs/heads/codex/harness-goal-loop-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harness-goal-loop-20260919
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Verify and apply non-workflow source changes on this branch only
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          PATCH_SHA256: 9f1222ae9a5fbc3678a08b76184ab13af27fe514bf909171d25fcded0dcc4649
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if test ! -f .harness-goal.patch; then exit 0; fi
          test "$(cat .harness-goal.patch)" = "$PATCH_SHA256"
          cat .harness-goal.part0 .harness-goal.part1 .harness-goal.part2 .harness-goal.part3 .harness-goal.part4 | base64 --decode > "$RUNNER_TEMP/harness-goal.br"
          node -e 'const f=require("node:fs"),z=require("node:zlib");f.writeFileSync(process.argv[2],z.brotliDecompressSync(f.readFileSync(process.argv[1])))' "$RUNNER_TEMP/harness-goal.br" "$RUNNER_TEMP/harness-goal.diff"
          echo "$PATCH_SHA256  $RUNNER_TEMP/harness-goal.diff" | sha256sum --check --strict
          git apply --check --exclude='.github/workflows/*' "$RUNNER_TEMP/harness-goal.diff"
          git apply --index --exclude='.github/workflows/*' "$RUNNER_TEMP/harness-goal.diff"
          git rm .harness-goal.patch .harness-goal.part0 .harness-goal.part1 .harness-goal.part2 .harness-goal.part3 .harness-goal.part4
          git diff --cached --check
          git config user.name 'AporiaX Harness Maintenance'
          git config user.email 'harness-maintenance@users.noreply.github.com'
          git commit -m 'feat(harness): durable decisions, acceptance, event waits and native protocols'
          git push origin HEAD:refs/heads/codex/harness-goal-loop-20260919
