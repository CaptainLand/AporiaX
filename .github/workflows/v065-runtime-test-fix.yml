name: v0.6.5 runtime smoke fix

on:
  push:
    branches:
      - agent/0.6.5-execution-permissions
    paths:
      - scripts/fix-v065-runtime-smoke.mjs
      - .github/workflows/v065-runtime-test-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.6.5-execution-permissions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/fix-v065-runtime-smoke.mjs
      - run: npm ci
      - run: npm run test:runtime
      - run: npm run test:execution-policy && npm run test:execution-wiring
      - name: Commit test alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/runtime-smoke.mjs
          git commit -m "test: align runtime smoke with smart permission"
          git push origin HEAD:agent/0.6.5-execution-permissions
