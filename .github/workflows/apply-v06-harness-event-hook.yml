name: Apply v0.6 Harness event hook

on:
  pull_request:
    branches:
      - agent/v0.6-renderer-modules
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  extract-and-validate:
    if: ${{ github.event.pull_request.head.ref == 'agent/v0.6-harness-event-reducer' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.repository }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extract Harness event hook
        run: node scripts/apply-v06-harness-event-hook.mjs
      - run: npm ci --ignore-scripts
      - run: npm run test:task-store
      - run: npm run test:runtime-ui
      - run: npm run test:process-ui
      - run: npm run test:renderer-architecture
      - run: npm run test:renderer-modules
      - run: npm run test:harness-events-ui
      - run: npm run test:skills
      - run: npm run test:architecture
      - run: npm run build
      - name: Commit validated extraction
        run: |
          git config user.name "AporiaX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: extract renderer Harness event hook [v06-harness-events]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
