name: Validate capability observability

on:
  pull_request:
    branches:
      - agent/v0.6-extensions-center
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: github.head_ref == 'agent/v0.6-capability-observability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.6-capability-observability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-capability-observability.mjs
      - run: npm ci --ignore-scripts
      - run: npm run test:capability-observability
      - run: npm run test:capabilities
      - run: npm run test:mcp-capabilities
      - run: npm run test:p0
      - run: npm run test:harness-events-ui
      - run: npm run test:runtime
      - run: npm run test:harness-v2
      - run: npm run build
      - name: Commit validated migration
        run: |
          git config user.name "AporiaX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: drive observability from capabilities [capability-observability]"
          git push origin HEAD:agent/v0.6-capability-observability
