name: Apply MCP integration patch

on:
  push:
    branches:
      - agent/mcp-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[mcp-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mcp-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact MCP integration patch
        run: node scripts/apply-mcp-integration.mjs
      - name: Commit generated integration
        run: |
          git config user.name "AporiaX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire MCP into agent runtime [mcp-patch]"
          git push origin HEAD:agent/mcp-v1
