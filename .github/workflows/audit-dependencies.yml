# Temporary PR #62 preparation; removed before review.
name: Prepare offline audit dependencies
on:
  push:
    branches: [fix/0.9.7-architecture-reliability-audit]
    paths: [.github/workflows/audit-dependencies.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Archive only installed public dependencies
        run: tar --exclude=node_modules/electron/dist --exclude=node_modules/app-builder-bin --exclude=node_modules/7zip-bin -czf audit-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: audit-dependencies-${{ github.run_id }}
          path: audit-dependencies.tar.gz
          retention-days: 2
          if-no-files-found: error
