name: Validate runtime tool permissions

on:
  pull_request:
    branches:
      - agent/v0.6-streaming-performance
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: ${{ github.event.pull_request.head.ref == 'agent/v0.6-runtime-tool-permissions' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.6-runtime-tool-permissions
          fetch-depth: 0
      - name: Fetch validated streaming base
        run: git fetch origin agent/v0.6-streaming-performance --depth=1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply runtime permission integration
        run: node scripts/apply-runtime-permission-refactor.mjs
      - run: npm ci --ignore-scripts
      - run: npm run test:tool-permissions
      - run: npm run test:process-ui
      - run: npm run test:browser
      - run: npm run test:mcp
      - run: npm run test:runtime
      - run: npm run test:harness-v2
      - run: npm run build
      - name: Commit validated integration
        run: |
          git config user.name "AporiaX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: unify tool permission decisions [tool-permissions-validated]"
          git push origin HEAD:agent/v0.6-runtime-tool-permissions
