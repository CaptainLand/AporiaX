name: Apply verified harness loop changes
on:
  push:
    branches: [codex/harness-loop-20260918]
    paths: [.github/workflows/harness-loop-workbench.yml, .harness-loop.patch]
permissions:
  contents: read
jobs:
  apply-reviewed-patch:
    if: github.repository == 'CaptainLand/AporiaX' && github.ref == 'refs/heads/codex/harness-loop-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harness-loop-20260918
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Verify and apply the tested diff on the development branch
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          PATCH_SHA256: 2ddda0d19eec6f2a801c88b7bc147f340bc6c94a42cf1aa032bc047f6a2a51c4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(cat .harness-loop.patch)" = "$PATCH_SHA256"
          cat .harness-loop.part0 .harness-loop.part1 .harness-loop.part2 .harness-loop.part3 | base64 --decode > "$RUNNER_TEMP/harness-loop.br"
          node -e 'const f=require("node:fs"),z=require("node:zlib"); f.writeFileSync(process.argv[2],z.brotliDecompressSync(f.readFileSync(process.argv[1])))' "$RUNNER_TEMP/harness-loop.br" "$RUNNER_TEMP/harness-loop.diff"
          echo "$PATCH_SHA256  $RUNNER_TEMP/harness-loop.diff" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/harness-loop.diff"
          git apply --index "$RUNNER_TEMP/harness-loop.diff"
          git rm .harness-loop.patch .harness-loop.part0 .harness-loop.part1 .harness-loop.part2 .harness-loop.part3 .github/workflows/harness-loop-workbench.yml
          git diff --cached --check
          git config user.name 'AporiaX Harness Maintenance'
          git config user.email 'harness-maintenance@users.noreply.github.com'
          git commit -m 'feat(harness): improve loop efficiency and bounded recovery with regression coverage'
          git push origin HEAD:refs/heads/codex/harness-loop-20260918
