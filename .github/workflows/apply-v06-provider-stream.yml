name: Apply v0.6 provider stream runtime

on:
  pull_request:
    branches:
      - agent/v0.6-harness-event-reducer
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  extract-and-validate:
    if: ${{ github.event.pull_request.head.ref == 'agent/v0.6-runtime-provider-stream' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.repository }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extract provider streaming runtime
        run: node scripts/apply-v06-provider-stream.mjs
      - run: npm ci --ignore-scripts
      - run: npm run test:provider-stream
      - run: npm run test:runtime
      - run: npm run test:vision
      - run: npm run test:mcp
      - run: npm run test:browser
      - run: npm run test:architecture
      - run: npm run test:harness-v2
      - run: npm run build
      - name: Commit validated extraction
        run: |
          git config user.name "AporiaX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: extract provider streaming runtime [v06-provider-stream]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
