# Temporary exact source transport for PR #62; removed in the source commit.
name: Stage verified audit follow-up
on:
  push:
    branches: [fix/0.9.7-architecture-reliability-audit]
    paths: [.github/workflows/audit-followup.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact before/after bytes and store source blobs
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH: 
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          const decoded = gunzipSync(Buffer.from(process.env.PATCH, 'base64'), {maxOutputLength: 100000});
          if (createHash('sha256').update(decoded).digest('hex') !== '4895ddf808d6f82eb35dda6a66a71aab728cb82f871e9d7be18fa076d17e9afa') throw Error('Patch integrity mismatch');
          const hash = b => createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');
          const patch = JSON.parse(decoded), files = [];
          for (const file of patch.files) {
            if (file.path.includes('..') || !/^(electron|tests|\.github)\//.test(file.path)) throw Error('Unexpected source path');
            const before = readFileSync(file.path);
            if (hash(before) !== file.before) throw Error('Source changed: ' + file.path);
            const chunks = []; let pos = 0;
            for (const [start,end,text] of file.edits) {
              if(start < pos || end < start || end > before.length) throw Error('Invalid edit');
              chunks.push(before.subarray(pos,start),Buffer.from(text)); pos=end;
            }
            chunks.push(before.subarray(pos)); const after=Buffer.concat(chunks);
            if(hash(after)!==file.after) throw Error('Updated hash mismatch: '+file.path);
            const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({content:after.toString('base64'),encoding:'base64'})});
            if(!response.ok) throw Error('Source blob creation: '+response.status);
            const blob=await response.json(); if(blob.sha!==file.after)throw Error('Remote hash mismatch');
            files.push({path:file.path,sha:blob.sha,mode:'100644',type:'blob'});
          }
          console.log(JSON.stringify(files));
          writeFileSync('audit-followup-tree.json',JSON.stringify(files));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: audit-followup-tree-${{ github.run_id }}
          path: audit-followup-tree.json
          retention-days: 2
