name: v0.6.5 LSP no-workspace fix

on:
  push:
    branches:
      - agent/0.6.5-lsp
    paths:
      - scripts/fix-v065-lsp-no-workspace.mjs
      - .github/workflows/v065-lsp-no-workspace-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.6.5-lsp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/fix-v065-lsp-no-workspace.mjs
      - run: npm ci
      - run: node --check electron/agent-runtime-core.js
      - run: npm run test:lsp
      - run: npm run build
      - name: Commit lifecycle fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/agent-runtime-core.js
          git commit -m "fix: keep LSP optional for conversation-only tasks"
          git push origin HEAD:agent/0.6.5-lsp
