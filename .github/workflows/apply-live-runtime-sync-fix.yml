name: Apply live runtime sync fix

on:
  push:
    branches:
      - agent/live-status-prompt-fold

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[live-runtime-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-status-prompt-fold
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact runtime UI patch
        run: node scripts/apply-live-runtime-sync-fix.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - run: npm run test:runtime-ui
      - run: npm run test:process-ui
      - run: npm run build
      - name: Commit validated fix
        run: |
          git config user.name "AporiaX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: bind live runtime UI by message id [live-runtime-sync]"
          git push origin HEAD:agent/live-status-prompt-fold
