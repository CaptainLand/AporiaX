name: Apply v0.6 TaskStore

on:
  pull_request:
    branches:
      - agent/live-status-prompt-fold
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: ${{ github.event.pull_request.head.ref == 'agent/v0.6-architecture-phase1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.repository }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply TaskStore migration
        run: node scripts/apply-v06-task-store.mjs
      - run: npm ci --ignore-scripts
      - run: npm run test:task-store
      - run: npm run test:runtime-ui
      - run: npm run test:process-ui
      - run: npm run test:architecture
      - run: npm run build
      - name: Commit validated migration
        run: |
          git config user.name "AporiaX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: make TaskStore the renderer state source [v06-task-store]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
