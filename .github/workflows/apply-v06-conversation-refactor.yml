name: Apply v0.6 conversation refactor

on:
  push:
    branches:
      - agent/v0.6-architecture-phase1

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[v06-conversation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.6-architecture-phase1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact conversation refactor
        run: node scripts/apply-v06-conversation-refactor.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - run: npm run test:runtime-ui
      - run: npm run test:process-ui
      - run: npm run build
      - name: Commit validated refactor
        run: |
          git config user.name "AporiaX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: render conversation runtime UI natively [v06-conversation]"
          git push origin HEAD:agent/v0.6-architecture-phase1
