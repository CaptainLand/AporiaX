name: Apply Cloud client review fixes
on:
  push:
    branches: [codex/cloud-v1-client-contract-20260922]
    paths: [.github/workflows/cloud-review-apply.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'CaptainLand/AporiaX' && github.ref == 'refs/heads/codex/cloud-v1-client-contract-20260922'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cloud-v1-client-contract-20260922
      - name: Apply reviewed source with unchanged checksum
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -f .cloud-review.b64 || exit 0
          node -e 'const f=require("node:fs"),z=require("node:zlib");f.writeFileSync(process.argv[1],z.inflateSync(Buffer.from(f.readFileSync(".cloud-review.b64","utf8"),"base64")))' "$RUNNER_TEMP/cloud-review.diff"
          echo "3c66d43acfa99a733b57e5d8ca9ae39afb7a63a0ade3db0f8b26e6fbb55be0ac  $RUNNER_TEMP/cloud-review.diff" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/cloud-review.diff"
          git apply --index "$RUNNER_TEMP/cloud-review.diff"
          git rm .cloud-review.b64
          git diff --cached --check
          git config user.name 'AporiaX Cloud Maintenance'
          git config user.email 'cloud-maintenance@users.noreply.github.com'
          git commit -m 'fix(cloud): preserve internal vision capability and align endpoint regression tests'
          git push origin HEAD:refs/heads/codex/cloud-v1-client-contract-20260922
