name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime smoke
        run: npm run test:runtime

      - name: Architecture smoke
        run: npm run test:architecture

      - name: SQLite run event store smoke
        run: npm run test:run-store-sqlite

      - name: Task runtime RPC smoke
        run: npm run test:task-runtime-rpc

      - name: Agent runtime broker smoke
        run: npm run test:agent-runtime-broker

      - name: Execution policy smoke
        run: npm run test:execution-policy

      - name: Execution wiring smoke
        run: npm run test:execution-wiring

      - name: LSP smoke
        run: npm run test:lsp

      - name: LSP installer smoke
        run: npm run test:lsp-installer

      - name: GitHub workflow smoke
        run: npm run test:github-workflow

      - name: Desktop account auth smoke
        run: npm run test:account-ui

      - name: Aporia Cloud model runtime smoke
        run: npm run test:cloud-model

      - name: Vision proxy smoke
        run: npm run test:vision

      - name: Aporia Cloud vision security smoke
        run: node tests/aporia-cloud-vision-smoke.mjs

      - name: Tool permission smoke
        run: npm run test:tool-permissions

      - name: Tool dispatcher smoke
        run: npm run test:tool-dispatcher

      - name: Production test feedback smoke
        run: node tests/runtime-test-polish-smoke.mjs

      - name: Build renderer
        run: npm run build
