name: Refresh browser lockfile

on:
  push:
    branches:
      - agent/browser-v1

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[browser-lock]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/browser-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/refresh-browser-lock.yml
          git config user.name "AporiaX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "build: refresh browser dependency lockfile [browser-lock]"
          git push origin HEAD:agent/browser-v1
