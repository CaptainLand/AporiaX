name: Upload verified desktop mirror

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag with a prepared GitHub draft
        required: true
        type: string
      checksum_sha256:
        description: Independently verified SHA-256 of the mirror checksum manifest
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-mirror-upload-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Verify immutable release source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release-source.mjs
      - name: Download exact published mirror files and fill draft assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CHECKSUM_SHA256: ${{ inputs.checksum_sha256 }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CHECKSUM_SHA256" =~ ^[a-f0-9]{64}$ ]]
          export RELEASE_VERSION="${RELEASE_TAG#v}"
          mkdir "$RUNNER_TEMP/desktop-release"
          cd "$RUNNER_TEMP/desktop-release"
          manifest="SHA256SUMS-$RELEASE_VERSION.txt"
          files=("AporiaX-Setup-$RELEASE_VERSION-x64.exe" "AporiaX-Portable-$RELEASE_VERSION-x64.exe" "AporiaX-Setup-$RELEASE_VERSION-x64.exe.blockmap" latest.yml "$manifest")
          for file in "${files[@]}"; do
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 2 --connect-timeout 20 --max-time 600 --output "$file" "https://aporiax.cloud/downloads/$file"
          done
          printf '%s  %s\n' "$CHECKSUM_SHA256" "$manifest" | sha256sum -c -
          # The trusted checksum digest binds every versioned file and latest.yml.
          sha256sum -c "$manifest"
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets > release.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const version = process.env.RELEASE_VERSION;
          const names = [`AporiaX-Setup-${version}-x64.exe`, `AporiaX-Portable-${version}-x64.exe`, `AporiaX-Setup-${version}-x64.exe.blockmap`, 'latest.yml', `SHA256SUMS-${version}.txt`];
          const release = JSON.parse(readFileSync('release.json'));
          assert.equal(release.tagName, process.env.RELEASE_TAG);
          assert.equal(release.isDraft, true, 'Never mutate an already-public release');
          const seen = new Set();
          for (const asset of release.assets) {
            assert(names.includes(asset.name) && !seen.has(asset.name), 'Unexpected or duplicate asset');
            seen.add(asset.name);
            const bytes = readFileSync(asset.name);
            assert.equal(asset.state, 'uploaded'); assert.equal(asset.size, bytes.length);
            assert.equal(asset.digest, 'sha256:' + createHash('sha256').update(bytes).digest('hex'));
          }
          writeFileSync('missing.txt', names.filter(name => !seen.has(name)).join('\n'));
          NODE
          # Matching completed uploads are kept, never overwritten.
          while IFS= read -r file || [[ -n "$file" ]]; do
            [[ -n "$file" ]] && gh release upload "$RELEASE_TAG" "$file"
          done < missing.txt
          echo 'Draft assets uploaded. Publication still requires the separate digest-verification gate.'
