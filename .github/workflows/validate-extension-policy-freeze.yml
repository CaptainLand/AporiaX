name: Validate v0.6 architecture freeze

on:
  pull_request:
    branches:
      - agent/v0.6-turn-coordinator
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: github.head_ref == 'agent/v0.6-extension-policy-freeze'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.6-extension-policy-freeze
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-extension-policy-freeze.mjs
      - run: npm ci --ignore-scripts
      - run: npm run test:extension-policy
      - run: npm run test:v06-architecture
      - run: npm run test:extensions
      - run: npm run test:capability-observability
      - run: npm run test:capabilities
      - run: npm run test:mcp-capabilities
      - run: npm run test:harness-event-reducer
      - run: npm run test:turn-coordinator
      - run: npm run test:task-store
      - run: npm run test:streaming-performance
      - run: npm run test:tool-permissions
      - run: npm run test:tool-dispatcher
      - run: npm run test:self-check-coordinator
      - run: npm run test:subagent-loop
      - run: npm run test:browser
      - run: npm run test:mcp
      - run: npm run test:runtime
      - run: npm run test:harness-v2
      - run: npm run build
      - name: Commit validated architecture freeze
        run: |
          git config user.name "AporiaX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: freeze AporiaX v0.6 architecture [v06-freeze]"
          git push origin HEAD:agent/v0.6-extension-policy-freeze
