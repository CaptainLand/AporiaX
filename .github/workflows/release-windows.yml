name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.3.0

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify runtime
        run: npm run test:runtime

      - name: Verify P0 models
        run: npm run test:p0

      - name: Build Windows packages
        run: npm run dist:win

      - name: Upload packages and publish preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = "docs/RELEASE_NOTES_$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Release notes not found: $notes"
          }
          gh release upload $tag `
            "release/AporiaX-Setup-$version-x64.exe" `
            "release/AporiaX-Portable-$version-x64.exe" `
            --repo "${{ github.repository }}" `
            --clobber
          gh release edit $tag `
            --repo "${{ github.repository }}" `
            --title "AporiaX $tag — Preview" `
            --notes-file $notes `
            --prerelease `
            --draft=false
