name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Verify release source and version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release-source.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify runtime
        run: npm run test:runtime

      - name: Verify P0 models
        run: npm run test:p0

      - name: Verify approval and Builder recovery
        run: npm run test:critical-reliability

      - name: Verify context and extension recovery
        run: npm run test:context-reliability

      - name: Verify durable reliability and release invariants
        run: npm run test:reliability-batch3

      - name: Build verified Windows packages
        run: npm run dist:win

      - name: Verify packaged source, binaries and update hashes
        run: node scripts/verify-windows-release.mjs release

      - name: Upload packages and publish preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = "docs/RELEASE_NOTES_$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Release notes not found: $notes"
          }
          gh release upload $tag `
            "release/AporiaX-Setup-$version-x64.exe" `
            "release/AporiaX-Portable-$version-x64.exe" `
            "release/AporiaX-Setup-$version-x64.exe.blockmap" `
            "release/latest.yml" `
            "release/SHA256SUMS-$version.txt" `
            --repo $env:RELEASE_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed; release was not published." }
          gh release edit $tag `
            --repo $env:RELEASE_REPOSITORY `
            --title "AporiaX $tag — Preview" `
            --notes-file $notes `
            --prerelease `
            --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }
