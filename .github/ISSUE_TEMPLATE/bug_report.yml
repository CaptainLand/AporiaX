name: Bug report / 问题反馈
description: Report a reproducible AporiaX problem / 反馈可以复现的 AporiaX 问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AporiaX. 请勿提交 API Key、访问令牌或私人文件内容。
  - type: input
    id: version
    attributes:
      label: AporiaX version / 版本
      placeholder: 0.3.4
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Windows 版本
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / 模块
      options:
        - Dialogue / 对话
        - Route / 行动路径
        - Workspace / 工作区
        - Model provider / 模型 Provider
        - Local sandbox / 本地沙箱
        - Docker sandbox / Docker 沙箱
        - Office or PDF / Office 或 PDF
        - Packaging or startup / 安装或启动
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened? / 发生了什么？
      description: Describe the actual and expected behavior. / 描述实际表现和预期表现。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps / 复现步骤
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / 相关日志
      description: Remove API keys, tokens, paths, and private content before posting. / 发布前请移除密钥、令牌、私人路径和文件内容。
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 检查项
      options:
        - label: I searched existing issues. / 我已搜索现有 Issue。
          required: true
        - label: I removed credentials and private information. / 我已移除凭据和私人信息。
          required: true
