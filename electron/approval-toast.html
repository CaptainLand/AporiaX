<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>AporiaX</title>
    <style>
      html, body {
        margin: 0;
        padding: 18px;
        background: transparent;
        overflow: hidden;
        font-family: Inter, "SF Pro Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
        user-select: none;
      }
      .toast {
        display: grid;
        box-sizing: border-box;
        width: 360px;
        min-height: 148px;
        padding: 16px 16px 14px;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 12px;
        border: 1px solid rgba(94, 152, 178, 0.25);
        border-radius: 17px;
        color: #35464e;
        background:
          linear-gradient(135deg, rgba(84, 173, 212, 0.12), transparent 45%),
          rgba(250, 252, 252, 0.96);
        box-shadow: 0 8px 18px rgba(25, 45, 54, 0.14);
      }
      html[data-theme="dark"] .toast {
        border-color: rgba(82, 164, 202, 0.26);
        color: #d2dce1;
        background:
          linear-gradient(135deg, rgba(58, 150, 193, 0.12), transparent 46%),
          rgba(16, 22, 27, 0.96);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.32);
      }
      .icon {
        display: inline-flex;
        width: 36px;
        height: 36px;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        color: #287899;
        background: rgba(66, 158, 198, 0.13);
        font-size: 18px;
      }
      .copy { min-width: 0; }
      .eyebrow {
        color: #4d97b6;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      h1 {
        overflow: hidden;
        margin: 3px 0 0;
        color: #273941;
        font-size: 13.5px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      html[data-theme="dark"] h1 { color: #d8e2e7; }
      p {
        display: -webkit-box;
        overflow: hidden;
        margin: 7px 0 0;
        color: #697b84;
        font-size: 11.2px;
        line-height: 1.5;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      html[data-theme="dark"] p { color: #83969f; }
      .actions {
        display: flex;
        margin-top: 12px;
        justify-content: flex-end;
        gap: 8px;
      }
      button {
        min-width: 72px;
        height: 28px;
        padding: 0 12px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 620;
      }
      .deny {
        color: #47606b;
        background: rgba(92, 129, 145, 0.12);
      }
      .deny:hover { background: rgba(92, 129, 145, 0.18); }
      .approve {
        color: #fff;
        background: #2f7ea0;
      }
      .approve:hover { background: #276a87; }
    </style>
  </head>
  <body>
    <aside class="toast">
      <span class="icon" aria-hidden="true">!</span>
      <div class="copy">
        <div class="eyebrow" id="eyebrow">等待确认</div>
        <h1 id="title">需要确认</h1>
        <p id="body"></p>
        <div class="actions">
          <button class="deny" id="deny" type="button">拒绝</button>
          <button class="approve" id="approve" type="button">确认</button>
        </div>
      </div>
    </aside>
    <script>
      window.approvalToast?.onPayload((payload) => {
        document.documentElement.dataset.theme = payload.theme === "dark" ? "dark" : "light";
        document.getElementById("eyebrow").textContent = payload.eyebrow;
        document.getElementById("title").textContent = payload.title;
        document.getElementById("body").textContent = payload.body;
        document.getElementById("approve").textContent = payload.approve;
        document.getElementById("deny").textContent = payload.deny;
      });
      document.getElementById("approve").addEventListener("click", () => window.approvalToast.decide(true));
      document.getElementById("deny").addEventListener("click", () => window.approvalToast.decide(false));
    </script>
  </body>
</html>
